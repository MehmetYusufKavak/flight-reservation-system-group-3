<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Reservation System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ============ LOGIN VIEW ============ -->
  <main id="login-view" class="login-page" hidden>
    <form id="login-form" class="card login-card" novalidate>
      <h1>Flight Reservation System</h1>
      <p class="muted">Sign in to continue</p>

      <div id="login-alert" class="alert" role="alert" hidden></div>

      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required>

      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>

      <button id="login-submit" type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </main>

  <!-- ============ APP VIEW ============ -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="brand">✈ Flight Reservation System</span>
      <div class="user-box">
        <span id="user-email"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-btn" type="button" class="btn btn-light">Log out</button>
      </div>
    </header>

    <main class="container">
      <div id="app-alert" class="alert" role="alert" hidden></div>

      <section class="card">
        <div class="section-head">
          <h2>Flights</h2>
          <div class="actions">
            <button id="refresh-btn" type="button" class="btn btn-light">Refresh</button>
            <button id="add-flight-btn" type="button" class="btn btn-primary admin-only" hidden>+ Add flight</button>
          </div>
        </div>
        <p id="customer-note" class="muted" hidden>
          You are signed in as a customer, so you can view flights.
          Only administrators can add, edit or delete flights.
        </p>

        <div class="table-wrap">
          <table id="flights-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Flight no</th>
                <th>From</th>
                <th>To</th>
                <th>Departure</th>
                <th>Arrival</th>
                <th>Status</th>
                <th class="admin-only" hidden>Actions</th>
              </tr>
            </thead>
            <tbody id="flights-body"></tbody>
          </table>
        </div>
        <p id="flights-empty" class="muted" hidden>No flights found.</p>
      </section>
    </main>
  </div>

  <!-- ============ FLIGHT FORM (admin) ============ -->
  <dialog id="flight-dialog">
    <form id="flight-form" novalidate>
      <h2 id="flight-form-title">Add flight</h2>
      <div id="form-alert" class="alert" role="alert" hidden></div>

      <label for="f-number">Flight number</label>
      <input id="f-number" name="flightnumber" maxlength="10" required placeholder="TK555">

      <div class="row">
        <div>
          <label for="f-dep-airport">Departure airport</label>
          <select id="f-dep-airport" name="departureairportid" required></select>
        </div>
        <div>
          <label for="f-arr-airport">Arrival airport</label>
          <select id="f-arr-airport" name="arrivalairportid" required></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="f-dep-time">Departure</label>
          <input id="f-dep-time" name="departuredatetime" type="datetime-local" required>
        </div>
        <div>
          <label for="f-arr-time">Arrival</label>
          <input id="f-arr-time" name="arrivaldatetime" type="datetime-local" required>
        </div>
      </div>

      <label for="f-status">Status</label>
      <select id="f-status" name="flightstatus" required></select>

      <div class="dialog-actions">
        <button id="flight-cancel" type="button" class="btn btn-light">Cancel</button>
        <button id="flight-save" type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

services:
  db:
    image: postgres:16
    container_name: flight_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flight_user}
      POSTGRES_PASSWORD: ${DB_PASS:-flight_pass}
      POSTGRES_DB: ${DB_NAME:-flight_reservation}
    volumes:
      - db_data:/var/lib/postgresql/data
      # init.sql sadece volume BOSKEN (ilk kurulumda) calisir
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Lokal gelistirme icin (pgAdmin/DBeaver/backend). Sunucuda kapatilabilir.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flight_user} -d ${DB_NAME:-flight_reservation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
